[project]
name = "pc-keiba-viewer-plugin"
version = "1.0.0"
description = "Stdlib-only stdio MCP proxy for the PC-KEIBA viewer Agent Plugin"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["basedpyright>=1.34.0", "pytest>=8.4.0", "pytest-cov>=7.0.0", "ruff>=0.8.0", "ty>=0.0.35"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["F", "C90", "SIM", "RET", "I", "UP"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.basedpyright]
include = ["src", "tests"]
exclude = ["tmp", "node_modules", ".venv"]
extraPaths = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportAny = "error"
reportExplicitAny = "error"
reportImplicitOverride = "error"
reportImportCycles = "error"
reportUnannotatedClassAttribute = "error"

[tool.ty.environment]
python-version = "3.12"
extra-paths = ["src"]

[tool.pytest.ini_options]
addopts = "--cov=mcp_stdio_proxy --cov=run_mcp_stdio_proxy --cov-report=term-missing --cov-fail-under=95"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_lines = ["if __name__ == .__main__.:", "raise SystemExit", "^\\s*\\.\\.\\.$"]
show_missing = true
