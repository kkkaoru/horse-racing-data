[project]
name = "mlflow-ui"
version = "0.0.0"
requires-python = ">=3.14,<3.15"
# mlflow's `mlflow server` breaks on Python 3.14 (importlib.abc Traversable
# bug); pin to 3.12 to match repo standard and avoid it. Full mlflow (not
# mlflow-skinny) because this package runs the actual UI/tracking server.
# psycopg2-binary is the postgresql:// driver -- the full `mlflow` package
# does not declare it (unlike mlflow-skinny[db] in apps/mlflow), but the
# server process opens the same Neon-backed store, so it is required here too.
dependencies = ["mlflow>=3.14", "boto3", "psycopg2-binary>=2.9.0"]

[dependency-groups]
dev = ["basedpyright>=1.34.0", "pytest>=8.4.0", "pytest-cov>=7.0.0", "ruff>=0.8.0", "ty>=0.0.35"]

# Needed so `uv run python -m mlflow_ui.cli ...` (documented in README.md and
# used by the launchd ProgramArguments) can import the package regardless of
# invocation cwd -- without this, uv treats the project as dependency-only
# and never installs `src/mlflow_ui` into its own venv.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlflow_ui"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "PGH"]

[tool.basedpyright]
include = ["src", "tests"]
exclude = ["tmp", "node_modules"]
extraPaths = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportAny = "none"
reportExplicitAny = "error"
reportImplicitOverride = "error"
reportImportCycles = "error"
reportMissingTypeStubs = "none"
reportUnannotatedClassAttribute = "error"
reportUnknownArgumentType = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"

[tool.ty.environment]
extra-paths = ["src"]

[tool.pytest.ini_options]
addopts = "--cov=mlflow_ui --cov-report=term-missing --cov-fail-under=95"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_lines = ["if __name__ == .__main__.:", "raise SystemExit", "\\.\\.\\."]
show_missing = true
