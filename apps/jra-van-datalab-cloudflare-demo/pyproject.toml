[project]
name = "jra-van-datalab-cloudflare-container"
version = "0.1.0"
requires-python = ">=3.13"

[dependency-groups]
dev = ["coverage>=7.10.6", "pytest>=8.4.1", "pytest-cov>=6.2.1", "ruff>=0.12.11"]

[tool.pytest.ini_options]
addopts = "--cov=container.acquisition --cov-fail-under=95"
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
