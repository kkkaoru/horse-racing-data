name: Deploy JV-Link Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-jvlink-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: apps/jra-van-datalab-worker-only-probe
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GH_TOKEN: ${{ secrets.PRIVATE_CORE_READ_TOKEN }}
      JRA_VAN_WORKER_API_TOKEN: ${{ secrets.JRA_VAN_WORKER_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install workspace dependencies
        working-directory: .
        run: bun install --frozen-lockfile
      - name: Fetch pinned private core
        run: bun run core:prepare
      - name: Verify public host
        run: |
          bun run format:check
          bun run lint
          bun run tsc
          bun run test:coverage
          bun run test:compatibility:local
      - name: Upload private artifact provenance
        run: bun run artifact:upload
      - name: Deploy Worker
        run: bunx wrangler deploy
      - name: Verify production
        run: bun run test:e2e
